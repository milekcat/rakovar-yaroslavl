services:
  - type: web
    name: rakovar-preview
    runtime: python
    plan: free
    region: frankfurt
    buildCommand: python prepare_render.py && pip install -r requirements.txt
    startCommand: python start_render_preview.py
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: DEMO_MODE
        value: "true"
      - key: COOKIE_SECURE
        value: "true"
      - key: FLASK_SECRET_KEY
        generateValue: true
      - key: ADMIN_PASSWORD_HASH
        sync: false
      - key: SQLITE_DB_PATH
        value: /tmp/rakovar-preview.sqlite3
      - key: MAX_BOT_USERNAME
        value: id7606139934_5_bot
      - key: LOYALTY_RUB_PER_TICKET
        value: "1000"
      - key: PREVIEW_DELIVERY_RUB
        value: "200"
      - key: PREVIEW_DELIVERY_MIN_RUB
        value: "1000"
